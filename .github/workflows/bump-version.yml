name: Bump PWA Version

# Workflow manuel pour incrémenter la version de tous les fichiers du site mobile (PWA) en même temps.
# Incrémente :
#   - CACHE_VERSION dans static/sw.js  (ex: v19 → v20)
#   - ?v=X.X de main.css, settings.js, index.js, film.js dans les templates
#   - Le texte "Version X.X" visible dans la modale Paramètres

on:
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Bump versions
        run: python scripts/bump_pwa_version.py

      - name: Commit & push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/sw.js templates/base.html templates/index.html templates/film.html
          git diff --cached --quiet && echo "Rien a commiter." && exit 0
          git commit -m "chore: bump PWA version"
          git push
