name: Bump PWA Version

# Workflow manuel pour incrémenter la version du site mobile (PWA).
# Incrémente en une seule opération :
#   - CACHE_VERSION dans static/sw.js  (ex: v19 → v20)
#   - ?v=X.X de main.css, settings.js, index.js, film.js dans les templates
#   - Le texte "Version X.X" visible dans la modale Paramètres

on:
  workflow_dispatch:
    inputs:
      bump_css:
        description: 'Incrémenter main.css (modifié ?)'
        required: true
        type: boolean
        default: true
      bump_settings_js:
        description: 'Incrémenter settings.js (modifié ?)'
        required: true
        type: boolean
        default: false
      bump_index_js:
        description: 'Incrémenter index.js (modifié ?)'
        required: true
        type: boolean
        default: false
      bump_film_js:
        description: 'Incrémenter film.js (modifié ?)'
        required: true
        type: boolean
        default: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Bump versions
        env:
          BUMP_CSS: ${{ github.event.inputs.bump_css }}
          BUMP_SETTINGS_JS: ${{ github.event.inputs.bump_settings_js }}
          BUMP_INDEX_JS: ${{ github.event.inputs.bump_index_js }}
          BUMP_FILM_JS: ${{ github.event.inputs.bump_film_js }}
        run: |
          python - << 'EOF'
          import re, os

          def bump_minor(version_str):
              """Incrémente la partie décimale d'une version X.Y de 0.1."""
              major, minor = version_str.split('.')
              return f"{major}.{int(minor) + 1}"

          def bump_sw_version(path):
              """Incrémente vN → v(N+1) dans sw.js."""
              content = open(path).read()
              match = re.search(r"const CACHE_VERSION = 'v(\d+)';", content)
              if not match:
                  raise ValueError(f"CACHE_VERSION introuvable dans {path}")
              old_v = int(match.group(1))
              new_v = old_v + 1
              new_content = content.replace(
                  f"const CACHE_VERSION = 'v{old_v}';",
                  f"const CACHE_VERSION = 'v{new_v}';"
              )
              open(path, 'w').write(new_content)
              return old_v, new_v

          def bump_asset_version(path, filename, old_v, new_v):
              """Remplace ?v=old_v par ?v=new_v pour un filename donné."""
              content = open(path).read()
              pattern = rf"({re.escape(filename)})\?v={re.escape(old_v)}"
              if not re.search(pattern, content):
                  print(f"  ⚠️  {filename}?v={old_v} introuvable dans {path}")
                  return old_v
              new_content = re.sub(pattern, rf"\1?v={new_v}", content)
              open(path, 'w').write(new_content)
              return new_v

          def bump_version_display(path, old_v, new_v):
              """Met à jour l'affichage 'Version X.X' dans la modale Paramètres."""
              content = open(path).read()
              old_text = f"Version {old_v}"
              new_text = f"Version {new_v}"
              if old_text not in content:
                  print(f"  ⚠️  '{old_text}' introuvable dans {path}")
                  return
              open(path, 'w').write(content.replace(old_text, new_text))
              print(f"  ✅ Version affichée : {old_text} → {new_text}")

          # ── Chemins ──────────────────────────────────────────────
          sw_path        = 'static/sw.js'
          base_html      = 'templates/base.html'
          index_html     = 'templates/index.html'
          film_html      = 'templates/film.html'

          bump_css        = os.environ.get('BUMP_CSS', 'false').lower() == 'true'
          bump_settings   = os.environ.get('BUMP_SETTINGS_JS', 'false').lower() == 'true'
          bump_index      = os.environ.get('BUMP_INDEX_JS', 'false').lower() == 'true'
          bump_film       = os.environ.get('BUMP_FILM_JS', 'false').lower() == 'true'

          changed = bump_css or bump_settings or bump_index or bump_film

          if not changed:
              print("ℹ️  Aucun fichier sélectionné — rien à faire.")
              exit(0)

          # ── 1. Incrémenter CACHE_VERSION dans sw.js ───────────────
          old_sw, new_sw = bump_sw_version(sw_path)
          print(f"✅ sw.js CACHE_VERSION : v{old_sw} → v{new_sw}")

          # ── 2. Lire les versions courantes dans les templates ─────
          base_content = open(base_html).read()

          css_match      = re.search(r"main\.css\?v=([\d.]+)", base_content)
          settings_match = re.search(r"settings\.js\?v=([\d.]+)", base_content)
          index_content  = open(index_html).read()
          index_match    = re.search(r"index\.js\?v=([\d.]+)", index_content)
          film_content   = open(film_html).read()
          film_match     = re.search(r"film\.js\?v=([\d.]+)", film_content)

          cur_css      = css_match.group(1)      if css_match      else None
          cur_settings = settings_match.group(1) if settings_match else None
          cur_index    = index_match.group(1)    if index_match    else None
          cur_film     = film_match.group(1)     if film_match     else None

          new_settings = cur_settings  # valeur de référence pour .version-info

          # ── 3. Appliquer les incréments sélectionnés ─────────────
          if bump_css and cur_css:
              new_css = bump_minor(cur_css)
              bump_asset_version(base_html, 'css/main.css', cur_css, new_css)
              print(f"✅ main.css?v : {cur_css} → {new_css}")

          if bump_settings and cur_settings:
              new_settings = bump_minor(cur_settings)
              bump_asset_version(base_html, 'js/settings.js', cur_settings, new_settings)
              bump_version_display(base_html, cur_settings, new_settings)
              print(f"✅ settings.js?v : {cur_settings} → {new_settings}")

          if bump_index and cur_index:
              new_index = bump_minor(cur_index)
              bump_asset_version(index_html, 'js/index.js', cur_index, new_index)
              print(f"✅ index.js?v : {cur_index} → {new_index}")

          if bump_film and cur_film:
              new_film = bump_minor(cur_film)
              bump_asset_version(film_html, 'js/film.js', cur_film, new_film)
              print(f"✅ film.js?v : {cur_film} → {new_film}")

          print("\n🎉 Bump terminé avec succès.")
          EOF

      - name: Commit & push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/sw.js templates/base.html templates/index.html templates/film.html
          git diff --cached --quiet && echo "Rien à commiter." && exit 0
          git commit -m "chore: bump PWA version 🚀"
          git push
