name: Scrape Movies

on:
  # Exécution quotidienne à 00h05 et 10h05 heure française
  schedule:
    - cron: '05 23 * * *'
    - cron: '05 9 * * *'
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Vider le cache TMDB/OMDB avant de scraper'
        required: false
        type: boolean
        default: false
      force:
        description: 'Forcer un rescraping complet de toutes les dates'
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency: 
      group: scraper-group
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraping script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          THEATERS: ${{ secrets.THEATERS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.clear_cache }}" = "true" ]; then FLAGS="$FLAGS --clear-cache"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          python scrape.py $FLAGS

