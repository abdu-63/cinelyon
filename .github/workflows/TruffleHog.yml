name: TruffleHog Full Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  trufflehog_scan:
    name: Scan Repository for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          path: ./
          # On utilise extra_args pour passer les commandes filesystem
          extra_args: filesystem --only-verified --fail