<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  CINÉBOT — Widget chatbot pour cinelyon.fr                   ║
  ║                                                              ║
  ║  INSTRUCTIONS D'INSTALLATION :                               ║
  ║  1. Colle ce bloc juste avant </body> dans ton HTML          ║
  ║  2. Remplace CHATBOT_URL par l'URL de ton serveur Node.js    ║
  ║     Ex: https://mon-chatbot.railway.app                      ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<!-- ░░ STYLES DU CHATBOT ░░ -->
<style>
  /* Bouton flottant */
  #cinelyon-chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, #444cf7, #7c3aed);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 4px 24px rgba(68, 76, 247, 0.45);
    z-index: 9999;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #cinelyon-chat-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 30px rgba(68, 76, 247, 0.6);
  }

  /* Fenêtre de chat */
  #cinelyon-chat-window {
    position: fixed;
    bottom: 96px;
    right: 24px;
    width: 350px;
    height: 500px;
    background: #0a0a1a;
    border: 1px solid rgba(68, 76, 247, 0.3);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    z-index: 9998;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(68, 76, 247, 0.25);
    /* Animation d'ouverture/fermeture */
    transform: scale(0.9) translateY(12px);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  #cinelyon-chat-window.ouvert {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: all;
  }

  /* En-tête */
  .cl-header {
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(68,76,247,0.2), rgba(124,58,237,0.15));
    border-bottom: 1px solid rgba(68, 76, 247, 0.2);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .cl-header-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #444cf7, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .cl-header-name {
    font-size: 14px;
    font-weight: 700;
    color: #e0e0ff;
    letter-spacing: 0.3px;
  }
  .cl-header-status {
    font-size: 11px;
    color: rgba(160, 165, 255, 0.6);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .cl-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    animation: cl-pulse 2s infinite;
  }
  @keyframes cl-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Zone des messages */
  .cl-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: rgba(68, 76, 247, 0.3) transparent;
  }
  .cl-messages::-webkit-scrollbar { width: 4px; }
  .cl-messages::-webkit-scrollbar-thumb { background: rgba(68, 76, 247, 0.3); border-radius: 2px; }

  /* Bulles de message */
  .cl-msg {
    max-width: 86%;
    font-size: 13.5px;
    line-height: 1.55;
    padding: 9px 13px;
    border-radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .cl-msg.bot {
    background: rgba(68, 76, 247, 0.12);
    border: 1px solid rgba(68, 76, 247, 0.2);
    color: #d8d9ff;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
  }
  .cl-msg.user {
    background: linear-gradient(135deg, rgba(68,76,247,0.4), rgba(124,58,237,0.35));
    border: 1px solid rgba(124, 58, 237, 0.3);
    color: #f0f0ff;
    align-self: flex-end;
    border-bottom-right-radius: 3px;
  }
  .cl-msg.typing {
    color: rgba(160, 165, 255, 0.55);
    font-size: 12px;
    letter-spacing: 1px;
    animation: cl-blink 1.3s infinite;
  }
  @keyframes cl-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Suggestions rapides */
  .cl-suggestions {
    padding: 0 14px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
  }
  .cl-chip {
    background: rgba(68, 76, 247, 0.1);
    border: 1px solid rgba(68, 76, 247, 0.25);
    color: rgba(160, 165, 255, 0.85);
    border-radius: 20px;
    padding: 4px 11px;
    font-size: 11.5px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .cl-chip:hover {
    background: rgba(68, 76, 247, 0.25);
    color: #e0e0ff;
  }

  /* Zone de saisie */
  .cl-input-area {
    padding: 10px 12px;
    border-top: 1px solid rgba(68, 76, 247, 0.2);
    background: rgba(10, 10, 30, 0.9);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .cl-input-area input {
    flex: 1;
    background: rgba(68, 76, 247, 0.07);
    border: 1px solid rgba(68, 76, 247, 0.25);
    border-radius: 8px;
    color: #e8e8ff;
    font-size: 13.5px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.2s;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .cl-input-area input:focus { border-color: rgba(68, 76, 247, 0.6); }
  .cl-input-area input::placeholder { color: rgba(160, 165, 255, 0.3); }
  .cl-send {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, #444cf7, #7c3aed);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .cl-send:hover { opacity: 0.85; }

  /* Responsive mobile */
  @media (max-width: 480px) {
    #cinelyon-chat-window {
      right: 12px;
      left: 12px;
      width: auto;
      bottom: 88px;
    }
  }
</style>

<!-- ░░ HTML DU CHATBOT ░░ -->
<button id="cinelyon-chat-btn" onclick="clToggle()" aria-label="Ouvrir CinéBot">🎬</button>

<div id="cinelyon-chat-window">
  <div class="cl-header">
    <div class="cl-header-avatar">🎥</div>
    <div>
      <div class="cl-header-name">CinéBot</div>
      <div class="cl-header-status">
        <span class="cl-dot"></span> Séances à Lyon en direct
      </div>
    </div>
  </div>

  <div class="cl-messages" id="clMessages"></div>

  <div class="cl-suggestions" id="clSuggestions">
    <button class="cl-chip" onclick="clEnvoyer('Quels films sont à l\'affiche ?')">🎬 Films à l'affiche</button>
    <button class="cl-chip" onclick="clEnvoyer('Quels cinémas sont disponibles ?')">🏛️ Les cinémas</button>
    <button class="cl-chip" onclick="clEnvoyer('Il y a des séances ce soir ?')">🌙 Ce soir</button>
    <button class="cl-chip" onclick="clEnvoyer('Films en IMAX ou 4DX ?')">✨ IMAX / 4DX</button>
  </div>

  <div class="cl-input-area">
    <input
      type="text"
      id="clInput"
      placeholder="Demande-moi les séances..."
      onkeydown="if(event.key==='Enter') clEnvoyer()"
      aria-label="Message pour CinéBot"
    />
    <button class="cl-send" onclick="clEnvoyer()" aria-label="Envoyer">➤</button>
  </div>
</div>

<!-- ░░ JAVASCRIPT DU CHATBOT ░░ -->
<script>
(function() {
  // ╔════════════════════════════════════════╗
  // ║  CONFIGURATION — À MODIFIER            ║
  // ╠════════════════════════════════════════╣
  // ║  Remplace cette URL par l'adresse de   ║
  // ║  ton serveur Node.js déployé.          ║
  // ║  Exemple Railway :                     ║
  // ║  https://cinelyon-bot.railway.app      ║
  // ╚════════════════════════════════════════╝
  const CHATBOT_URL = 'https://TON-SERVEUR.railway.app';

  let estOuvert = false;

  window.clToggle = function() {
    estOuvert = !estOuvert;
    document.getElementById('cinelyon-chat-window').classList.toggle('ouvert', estOuvert);

    // Message de bienvenue au premier ouverture
    if (estOuvert && document.getElementById('clMessages').children.length === 0) {
      clAjouter('bot', '👋 Salut ! Je suis CinéBot, ton assistant pour les séances de cinéma à Lyon.\n\nDemande-moi les films à l\'affiche, les horaires, les cinémas disponibles ou ce qui passe ce soir !');
    }
  };

  window.clEnvoyer = function(texteForce) {
    const input = document.getElementById('clInput');
    const texte = texteForce || input.value.trim();
    if (!texte) return;
    input.value = '';

    // Masque les suggestions après le premier message
    document.getElementById('clSuggestions').style.display = 'none';

    clAjouter('user', texte);
    const typing = clAjouter('bot typing', '🎬 Recherche en cours...');

    fetch(CHATBOT_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: texte })
    })
    .then(r => r.json())
    .then(data => {
      typing.remove();
      clAjouter('bot', data.reply || 'Désolé, je n\'ai pas pu obtenir une réponse.');
    })
    .catch(() => {
      typing.remove();
      clAjouter('bot', '😕 Impossible de joindre le serveur. Consulte directement cinelyon.fr !');
    });
  };

  function clAjouter(role, texte) {
    const el = document.createElement('div');
    el.className = 'cl-msg ' + role;
    el.textContent = texte;
    const conteneur = document.getElementById('clMessages');
    conteneur.appendChild(el);
    conteneur.scrollTop = conteneur.scrollHeight;
    return el;
  }
})();
</script>
