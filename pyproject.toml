[project]
name = "cinelyon"
version = "1.0.0"
description = "CinéLyon - Séances de cinéma à Lyon"
authors = [{name = "Abdu", email = "contact@cinelyon.fr"}]
dependencies = [
    "flask",
    "requests",
    "python-dotenv",
    "flask-compress",
    "flask-talisman",
    "supabase==2.28.0",
]
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
extend-exclude = [
    "skills",
    ".agents",
    "legacy-flask",
    "node_modules",
    ".next",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, warnings, isort
ignore = []

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"

[tool.pyrefly]
# Pyrefly analyses code fragments out of context (virtual inmemory files),
# generating false positives. The real linter (ruff) reports no issues.
ignore_missing_imports = true
